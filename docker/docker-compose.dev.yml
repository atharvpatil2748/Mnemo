name: mnemo-dev

services:
  mnemo-server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    depends_on:
      qdrant:
        condition: service_healthy
      surrealdb:
        condition: service_healthy
    environment:
      MNEMO_STORAGE_QDRANT_URL: http://qdrant:6333
      MNEMO_STORAGE_SURREALDB_URL: http://surrealdb:8000
    develop:
      watch:
        - action: sync+restart
          path: ../mnemo-server/mnemo_server
          target: /app/mnemo-server/mnemo_server

  mnemo-ui:
    build:
      context: ..
      dockerfile: docker/ui.Dockerfile
      target: development
    ports:
      - "3000:5173"
    volumes:
      - ../mnemo-ui/src:/app/src
      - ../mnemo-ui/index.html:/app/index.html
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.19.0
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 12

  surrealdb:
    image: surrealdb/surrealdb:v3.2.4
    # Phase 13 hardening: initialize the volume with nonroot ownership and remove this override.
    user: root
    working_dir: /data
    command: start --log info --user root --pass root
    environment:
      SURREAL_PATH: rocksdb://mnemo
    ports:
      - "8001:8000"
    volumes:
      - surrealdb_data:/data
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://127.0.0.1:8000"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  qdrant_data:
  surrealdb_data:
