[pytest]
pythonpath = .
testpaths =
    mnemo-core/tests
    mnemo-server/tests
    plugins/email-ingestion/tests
    tests
markers =
    local_database: tests that require local governed database/artifacts and are excluded in GitHub Actions CI
addopts = --strict-config --strict-markers --cov=mnemo --cov=mnemo_server --cov=email_ingestion --cov-report=term-missing --cov-report=xml --cov-fail-under=90
