[project]
name = "mnemo-core"
version = "0.9.0"
description = "Core library for the Mnemo local knowledge engine."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "packaging>=24,<27",
    "pydantic>=2.11,<3",
    "qdrant-client>=1.9.1",
    "surrealdb>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/atharvpatil2748/Mnemo"
Documentation = "https://github.com/atharvpatil2748/Mnemo/tree/main/docs"
Repository = "https://github.com/atharvpatil2748/Mnemo"
Issues = "https://github.com/atharvpatil2748/Mnemo/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mnemo"]
