[project]
name = "mnemo-core"
version = "0.22.0"
description = "Core library for the Mnemo local knowledge engine."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "anyio>=4.0",
    "beautifulsoup4>=4.15.0",
    "html5lib>=1.1",
    "httpx>=0.27.0",
    "langdetect>=1.0.9",
    "markdown-it-py>=4.2.0",
    "packaging>=24,<27",
    "pydantic>=2.11,<3",
    "pymupdf>=1.28.2",
    "python-docx>=1.1.0",
    "python-magic>=0.4.27",
    "qdrant-client>=1.9.1",
    "readability-lxml>=0.8.4.1",
    "surrealdb>=2.0.0",
    "tiktoken==0.13.0",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-c>=0.23,<0.26",
    "tree-sitter-cpp>=0.23,<0.26",
    "tree-sitter-go>=0.23,<0.26",
    "tree-sitter-java>=0.23,<0.26",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-python>=0.23,<0.26",
    "tree-sitter-rust>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.26",
]

[project.optional-dependencies]
reranking = ["sentence-transformers>=5.1,<6"]

[project.urls]
Homepage = "https://github.com/atharvpatil2748/Mnemo"
Documentation = "https://github.com/atharvpatil2748/Mnemo/tree/main/docs"
Repository = "https://github.com/atharvpatil2748/Mnemo"
Issues = "https://github.com/atharvpatil2748/Mnemo/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mnemo"]
