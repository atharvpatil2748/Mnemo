[project]
name = "mnemo-core"
version = "0.0.0"
description = "Core library for the Mnemo local knowledge engine."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mnemo"]
