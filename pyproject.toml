[project]
name = "mnemo-workspace"
version = "0.21.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pre-commit>=4.3,<5",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
    "twine>=6,<8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["mnemo-core", "mnemo-server", "plugins/email-ingestion"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
exclude = ["references", "mnemo-ui", ".venv"]

[tool.coverage.run]
branch = true
source = ["mnemo", "mnemo_server", "email_ingestion"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
