name: Bug report
description: Report reproducible behavior that conflicts with Mnemo's documented contracts.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please search existing issues and identify the affected roadmap module.
  - type: input
    id: version
    attributes:
      label: Mnemo version or commit
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Roadmap phase and module
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and reproduction
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and relevant logs
