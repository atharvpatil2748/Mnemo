[storage.filesystem]
enabled = true
root = "data/canonical_production/blobs"

[storage.sqlite]
enabled = true
path = "scratch/phase8_5_full_multilingual_v2/build-20260831-01/mnemo.db"

[storage.qdrant]
enabled = false
url = "http://localhost:6333"
collection_name = "mnemo_chunks"
on_disk = false

[storage.surrealdb]
enabled = false
url = "http://localhost:8001"
username = "root"
password = "root"
namespace = "mnemo"
database = "knowledge"

[plugins]
directory = "./plugins"

[phase85]
profile_file = "./config/model_profiles/full_multilingual_v2_profiles.toml"
profile_name = "full_multilingual_v2_local_prebuild"

[llm.planner]
provider = "ollama"
model = "gemma4:e4b"
max_context_tokens = 8192

[llm.synthesizer]
provider = "ollama"
model = "gemma4:e4b"
max_context_tokens = 8192

[llm.extractor]
provider = "ollama"
model = "gemma4:e4b"
max_context_tokens = 8192

[llm.classifier]
provider = "ollama"
model = "gemma4:e4b"
max_context_tokens = 4096

[embedding]
provider = "sentence-transformers"
model = "BAAI/bge-m3"
dimensions = 1024

[reranker]
provider = "v2-owned-pass-through"
model = "no-outer-reranker"
